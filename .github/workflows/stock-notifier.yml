name: Stock Notifier

# Cek stok KlikIndomaret berkala lalu kirim notifikasi Telegram.
# state.json di-commit ulang tiap run agar baseline antar-run tersambung.

on:
  schedule:
    # Tiap 5 menit = minimum yang diizinkan GitHub Actions.
    # PENTING kuota: tiap run di-bill minimal 1 menit -> ±8.800 menit/bulan.
    #   - Repo PUBLIC  : gratis (kuota menit tak terbatas)  -> pakai '*/5'
    #   - Repo PRIVATE : gratis hanya 2.000 menit/bulan -> kena biaya (~$0.008/menit)
    #     Kalau tetap private, turunkan ke '*/30' (±1.450 menit/bulan, gratis).
    - cron: '*/5 * * * *'
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write # untuk commit state.json

concurrency:
  group: stock-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cek stok & kirim notifikasi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py check

      - name: Simpan state ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "State tidak berubah."
          else
            git commit -m "chore: update state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
