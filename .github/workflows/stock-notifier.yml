name: Stock Notifier

# Cek stok KlikIndomaret lalu kirim notifikasi Telegram.
# Pemicu: cron-job.org (eksternal) -> POST ke dispatch API -> workflow_dispatch.
# Blok `schedule` internal GitHub dihapus: penjadwal GitHub bersifat
# best-effort dan terbukti tidak berjalan; cron-job.org presisi tiap 5 menit.

on:
  workflow_dispatch: # dipicu manual di tab Actions ATAU otomatis oleh cron-job.org

permissions:
  contents: write # untuk commit state.json

concurrency:
  group: stock-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cek stok & kirim notifikasi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py check

      - name: Simpan state ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "State tidak berubah."
          else
            git commit -m "chore: update state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
