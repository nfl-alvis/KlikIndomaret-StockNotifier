name: Stock Notifier

# Cek stok KlikIndomaret berkala lalu kirim notifikasi Telegram.
# state.json di-commit ulang tiap run agar baseline antar-run tersambung.

on:
  schedule:
    # Tiap 30 menit — aman untuk kuota gratis private repo (±1450 menit/bulan).
    # Repo public boleh dipercepat ke '*/15 * * * *'.
    - cron: '*/30 * * * *'
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

permissions:
  contents: write # untuk commit state.json

concurrency:
  group: stock-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cek stok & kirim notifikasi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py check

      - name: Simpan state ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "State tidak berubah."
          else
            git commit -m "chore: update state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
